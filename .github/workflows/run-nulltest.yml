name: Run PQG Null Test

on:
  workflow_dispatch:

jobs:
  run-nulltest:
    runs-on: ubuntu-latest

    steps:
      - name: Pull PQG Docker image
        run: docker pull ghcr.io/gliccser/pqg:latest

      - name: Run null_test.py with full stderr logging
        run: |
          docker run --rm -i \
            -v ${{ github.workspace }}:/out \
            ghcr.io/gliccser/pqg:latest \
            /bin/bash -c "python3 null_test.py" 2>&1 | tee nulltest_log.txt

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: nulltest-log
          path: nulltest_log.txt
