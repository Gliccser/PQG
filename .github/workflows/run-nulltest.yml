name: Run PQG Null Test

on:
  workflow_dispatch:

jobs:
  nulltest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LVK stack
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements_working.txt

      - name: Run null_test.py
        run: python3 null_test.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nulltest-results
          path: summary_null.txt
